# src/test/resources/application.yml
# CI 환경에서 테스트 실행을 위한 설정 (실제 기능 X, Context 로드만 목표)

spring:
  profiles:
    active: test

  # H2 In-memory DB
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

  # Jackson
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Seoul

  # Mail (더미)
  mail:
    host: smtp.test.com
    port: 587
    username: test@test.com
    password: test-password

# Aladin API (더미)
aladin:
  api:
    key: "test-aladin-api-key"
    url: "http://www.aladin.co.kr/ttb/api/ItemSearch.aspx"

# 카카오 (더미)
kakao:
  rest-api-key: "test-kakao-rest-api-key"
  client-secret: "test-kakao-client-secret"
  redirect-uri: "http://localhost:8081/api/auth/kakao/callback"

# JWT (더미 - Base64 인코딩 필수)
jwt:
  secret: "d2hvcmVhZHMtdGVzdC1zZWNyZXQta2V5LWZvci1qd3QtZGV2ZWxvcG1lbnQtb25seQ=="
  access-token-validity: 3600000
  refresh-token-validity: 604800000

# AWS (더미) — S3Properties가 읽는 실제 구조(cloud.aws.region, cloud.aws.s3.bucket)에 맞춤.
# Presigned URL 서명 자체는 Region만 있으면 되고(실제 자격증명은 context 로드 시점엔 불필요),
# S3Presigner 빈이 시작할 때 바로 만들어지므로 region이 없으면 contextLoads()가 실패한다.
cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: "test-bucket"

# Server
server:
  port: 8080

# Firebase (테스트용 더미 - 실제로는 Mock Bean 사용)
firebase:
  secret:
    path: "firebase/dummy-key.json"

# Logging (테스트 시 최소화)
logging:
  level:
    root: WARN
    whoreads.backend: INFO
